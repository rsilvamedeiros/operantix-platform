name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test ui with coverage
        run: pnpm --filter @operantix/ui test:coverage

      - name: Test web with coverage
        run: pnpm --filter @operantix/web test:coverage

      - name: Test contracts with coverage
        run: pnpm --filter @operantix/contracts test:coverage

      - name: Test messaging with coverage
        run: pnpm --filter @operantix/messaging test:coverage

      - name: Test secrets with coverage
        run: pnpm --filter @operantix/secrets test:coverage

      - name: Test http-client with coverage
        run: pnpm --filter @operantix/http-client test:coverage

      # Unit and integration tests (Testcontainers uses the runner's Docker) with coverage thresholds.
      - name: Test with coverage
        run: pnpm --filter @operantix/platform-api test:coverage

      - name: Test workflow worker with coverage
        run: pnpm --filter @operantix/workflow-worker test:coverage

      - name: Test integration worker with coverage
        run: pnpm --filter @operantix/integration-worker test:coverage

  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-service/uv.lock

      # uv installs the Python version pyproject.toml requires.
      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Typecheck
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest --cov

  images:
    name: Container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: platform-api
            dockerfile: Dockerfile.node
            context: .
            args: --build-arg APP=platform-api
          - image: workflow-worker
            dockerfile: Dockerfile.node
            context: .
            args: --build-arg APP=workflow-worker
          - image: integration-worker
            dockerfile: Dockerfile.node
            context: .
            args: --build-arg APP=integration-worker
          - image: ai-service
            dockerfile: services/ai-service/Dockerfile
            context: services/ai-service
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Builds only; nothing is pushed until the deploy pipeline exists (ADR-0035).
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.args }} -t operantix/${{ matrix.image }}:ci ${{ matrix.context }}
