name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Format
        run: terraform fmt -check -recursive

      # Every module and environment is validated without a backend or credentials; modules with
      # *.tftest.hcl files also run those tests against a mocked provider.
      - name: Validate and test
        run: |
          set -euo pipefail
          for dir in modules/*/ envs/*/; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if ls "$dir"*.tftest.hcl >/dev/null 2>&1; then
              terraform -chdir="$dir" test
            fi
            echo "::endgroup::"
          done
