name: Deploy scripts

on:
  pull_request:
    paths: ['scripts/deploy/**', '.github/workflows/deploy*.yml']
  push:
    branches: [main]
    paths: ['scripts/deploy/**', '.github/workflows/deploy*.yml']

permissions:
  contents: read

jobs:
  scripts:
    name: shellcheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: shellcheck
        run: shellcheck scripts/deploy/*.sh

      - name: Test against a fake aws CLI
        run: scripts/deploy/ecs-deploy.test.sh
