name: operantix

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operantix
      POSTGRES_USER: operantix
      POSTGRES_PASSWORD: operantix-local
    ports:
      - '5432:5432'
    volumes:
      - operantix_postgres:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/app-role.sql:/operantix/app-role.sql:ro
      - ./infrastructure/docker/postgres/worker-role.sql:/operantix/worker-role.sql:ro
      - ./infrastructure/docker/postgres/relay-role.sql:/operantix/relay-role.sql:ro
      - ./infrastructure/docker/postgres/integration-role.sql:/operantix/integration-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U operantix -d operantix']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Event backbone (M04, ADR-0004). Single-node KRaft; data is not persisted because the
  # outbox in PostgreSQL is the source of every event.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '9092:9092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/kafka/create-topics.sh:/operantix/create-topics.sh:ro
    entrypoint: ['/bin/bash', '/operantix/create-topics.sh']
    restart: 'no'

# MongoDB and observability services are intentionally deferred to their
# roadmap modules. Do not add them just because they appear in the target
# architecture.

volumes:
  operantix_postgres:
