# Stand-ins for RDS and ElastiCache so the spike runs on a laptop. Not for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: operantix-deps
  labels:
    operantix.dev/role: stand-in
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: operantix }
            - { name: POSTGRES_USER, value: operantix }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: operantix-secrets, key: owner-password }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, operantix, -d, operantix] }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: operantix-deps
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: operantix-deps
  labels:
    operantix.dev/role: stand-in
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: operantix-deps
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
