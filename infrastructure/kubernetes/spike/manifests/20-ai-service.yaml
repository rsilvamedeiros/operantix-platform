apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service
  namespace: operantix
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: operantix
  labels:
    operantix.dev/role: workload
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels:
        app: ai-service
        operantix.dev/tier: app
    spec:
      serviceAccountName: ai-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: operantix/ai-service:test
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: AI_SERVICE_ENV, value: development }
            - { name: AI_SERVICE_PORT, value: '8000' }
            - { name: AI_SERVICE_LLM_PROVIDER, value: fake }
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: operantix-secrets, key: ai-service-token }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: operantix
spec:
  selector: { app: ai-service }
  ports: [{ port: 8000 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-service
  namespace: operantix
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ai-service }
---
# Mirrors the ECS rule that the AI service only admits traffic from other workloads (ADR-0036).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service
  namespace: operantix
spec:
  podSelector:
    matchLabels: { app: ai-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { operantix.dev/tier: app }
      ports: [{ port: 8000 }]
