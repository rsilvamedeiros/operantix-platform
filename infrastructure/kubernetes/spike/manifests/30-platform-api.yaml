apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: operantix
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: operantix
  labels:
    operantix.dev/role: workload
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: platform-api }
  template:
    metadata:
      labels:
        app: platform-api
        operantix.dev/tier: app
    spec:
      serviceAccountName: platform-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: operantix/platform-api:test
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: '3000' }
            - { name: DATABASE_HOST, value: postgres.operantix-deps.svc.cluster.local }
            - { name: DATABASE_NAME, value: operantix }
            - { name: DATABASE_USER, value: operantix_app }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: operantix-secrets, key: app-password }
            - { name: REDIS_HOST, value: redis.operantix-deps.svc.cluster.local }
            - { name: AUTH_ISSUER, value: 'https://auth.example.com/' }
            - { name: AUTH_AUDIENCE, value: operantix-api }
            - { name: AUTH_JWKS_URI, value: 'https://auth.example.com/.well-known/jwks.json' }
            - name: SECRETS_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef: { name: operantix-secrets, key: encryption-keys }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: operantix
spec:
  selector: { app: platform-api }
  ports: [{ port: 3000 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
  namespace: operantix
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: platform-api }
